# Both checks must pass before a PR can be merged.

name: CI

on:
  push:
    branches:
      - '**'        # Run on all branches
  pull_request:
    branches:
      - main
      - Base

jobs:

  # Code quality checks
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run all pre-commit hooks
        env:
          SKIP: no-commit-to-branch
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files

  # Unit tests
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Debug - list files in root directory
        run: |
          echo "Current working directory: $(pwd)"
          echo "Files in root directory:"
          ls -la
          echo "Checking for pyproject.toml:"
          if [ -f "pyproject.toml" ]; then
            echo "✅ pyproject.toml found!"
            head -20 pyproject.toml
          else
            echo "❌ pyproject.toml NOT FOUND!"
            exit 1
          fi

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run unit tests (if they exist)
        run: |
          if [ -d "tests/unit" ] && [ "$(ls -A tests/unit 2>/dev/null)" ]; then
            PYTHONPATH=. pytest tests/unit/ -v --tb=short
          else
            echo "No unit tests found. Skipping."
          fi
        run: pip install -e ".[dev]"
        # Installs the project in editable mode with dev dependencies.
        # Does NOT install hyperon or GPU JAX — CI runs CPU only.

      - name: Run unit tests
        run: |
          if [ -d "tests/unit" ] && [ "$(ls -A tests/unit 2>/dev/null)" ]; then
            pytest tests/unit/ -v --tb=short
          else
            echo "No unit tests found. Skipping."
          fi

      - name: Run grammar integration tests (if they exist)
        run: |
          if [ -f "tests/unit/test_atomese.py" ]; then
            PYTHONPATH=. pytest tests/unit/test_atomese.py -v
          else
            echo "No grammar tests found. Skipping."
          fi
      - name: Run grammar integration tests
        run: |
          if [ -f "tests/unit/test_atomese.py" ]; then
            pytest tests/unit/test_atomese.py -v
          else
            echo "No grammar tests found. Skipping."
          fi
