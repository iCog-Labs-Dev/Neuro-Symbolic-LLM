name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - Base
      - symbolic_head
  workflow_dispatch:

jobs:

  # Code quality checks
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run all pre-commit hooks
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files

  # Unit tests
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev,miner]"

      - name: Require the released miner contract
        run: python -c "from hybrid_miner.contracts.semantic_document import SemanticDocument, SemanticRule; from hybrid_miner.ontology.bundle import OntologyBundle"

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

      - name: Run parser-to-miner contract integration
        run: >-
          python -m pytest
          tests/integration/test_catalog_bundle.py
          tests/integration/test_catalog_document_parser.py
          tests/integration/test_catalog_document_export.py
          -v --tb=short
