# Semantic Parser Predicate Schema
# Keep domain-specific/rare relations in Evaluation rather

predicates:

  # TAXONOMIC / MEMBERSHIP
  Inheritance:
    arity: 2
    roles: [instance, class]
    description: "X is a type or kind of Y"

  MemberOf:
    arity: 2
    roles: [member, group]
    description: "X is a member of Y"

  PartOf:
    arity: 2
    roles: [part, whole]
    description: "X is part of Y"

  # POSSESSION / ATTRIBUTE / STATE
  Has:
    arity: 2
    roles: [owner, possessed]
    description: "X has or possesses Y"

  PropertyOf:
    arity: 2
    roles: [entity, property]
    description: "X has property or attribute Y"

  StateOf:
    arity: 2
    roles: [entity, state]
    description: "X is in state Y"

  # ACTION / CAPABILITY / FUNCTION
  CanDo:
    arity: 2
    roles: [agent, action]
    description: "X is capable of performing Y"

  Performs:
    arity: 2
    roles: [agent, action]
    description: "X performs or performed action Y"

  UsedFor:
    arity: 2
    roles: [entity, purpose]
    description: "X is used for Y"

  Requires:
    arity: 2
    roles: [entity_or_process, requirement]
    description: "X requires Y"

  Enables:
    arity: 2
    roles: [enabler, enabled_action_or_state]
    description: "X enables Y"

  # CAUSAL / RESULT
  Cause:
    arity: 2
    roles: [cause, effect]
    description: "X causes Y"

  Produces:
    arity: 2
    roles: [producer_or_process, result]
    description: "X produces Y"

  Prevents:
    arity: 2
    roles: [preventer, prevented_event_or_state]
    description: "X prevents Y"

  # SPATIAL
  LocatedIn:
    arity: 2
    roles: [entity, location]
    description: "X is located in Y"

  "On":
    arity: 2
    roles: [entity, surface]
    description: "X is physically on Y"

  Contains:
    arity: 2
    roles: [container, contained]
    description: "X contains Y"

  Near:
    arity: 2
    roles: [entity, nearby_entity]
    description: "X is near Y"

  Between:
    arity: 3
    roles: [entity, reference_a, reference_b]
    description: "X is spatially or conceptually between Y and Z"

  # TEMPORAL
  Before:
    arity: 2
    roles: [earlier, later]
    description: "X happens before Y"

  After:
    arity: 2
    roles: [later, earlier]
    description: "X happens after Y"

  During:
    arity: 2
    roles: [event_or_state, time_or_event]
    description: "X occurs during Y"

  StartsAt:
    arity: 2
    roles: [event, start_time]
    description: "X starts at Y"

  EndsAt:
    arity: 2
    roles: [event, end_time]
    description: "X ends at Y"

  # GENERAL ENTITY RELATIONS
  SameAs:
    arity: 2
    roles: [entity, equivalent_entity]
    description: "X and Y refer to the same entity or concept"

  CreatedBy:
    arity: 2
    roles: [creation, creator]
    description: "X was created, authored, built, or produced by Y"

  WorksFor:
    arity: 2
    roles: [person, organization]
    description: "X works for Y"

  # FALLBACK
  Evaluation:
    variable_arity: true
    min_arity: 1
    max_arity: 4
    atomese_arity: 2
    fallback: true
    description: "Free-form relation not represented by a known predicate"


# Query/reasoning operations: world relations.
operators:

  And:
    variable_arity: true
    min_arity: 2
    description: "Logical conjunction of two or more expressions"

  Or:
    variable_arity: true
    min_arity: 2
    description: "Logical disjunction of two or more expressions"

  Count:
    arity: 1
    description: "Return the number of matching entities or expressions"

  Equal:
    arity: 2
    roles: [left, right]
    description: "X is equal to Y"

  GreaterThan:
    arity: 2
    roles: [left, right]
    description: "X is greater than Y"

  LessThan:
    arity: 2
    roles: [left, right]
    description: "X is less than Y"

  GreaterEqual:
    arity: 2
    roles: [left, right]
    description: "X is greater than or equal to Y"

  LessEqual:
    arity: 2
    roles: [left, right]
    description: "X is less than or equal to Y"

  ArgMax:
    arity: 2
    roles: [collection, attribute]
    description: "Select the entity with the maximum value of an attribute"

  ArgMin:
    arity: 2
    roles: [collection, attribute]
    description: "Select the entity with the minimum value of an attribute"


structural_predicates:

  List:
    variable_arity: true
    min_arity: 1
    max_arity: 4
    description: "Ordered argument container used by Evaluation"

  Not:
    arity: 1
    description: "Negation wrapper around one assertion"
