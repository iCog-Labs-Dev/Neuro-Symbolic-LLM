
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-symbolic-llm"
version = "0.1.0"
description = "Predictive-coding residual adaptation and symbolic retrieval on frozen LLMs"
requires-python = ">=3.11"

dependencies = [
    # Predictive Coding Framework
    "fabricpc @ git+https://github.com/trueagi-io/FabricPC.git@v0.6.0",

    # JAX Ecosystem
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "optax>=0.2.0",
    "orbax-checkpoint>=0.5.0",
    "numpy>=1.26",

    # Frozen LLM Substrate and Student Training
    "torch>=2.6.0,<2.13.0",
    "transformers>=5.0.0",
    "accelerate>=0.25.0",
    "peft>=0.10.0",
    "datasets>=2.14.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "torchax==0.0.14.dev20260617",

    # Semantic Parser Model Providers
    "openai>=1.0",
    "anthropic>=0.25",
    "google-genai>=2.0.0",
    "ollama>=0.4",

    # Symbolic Processing and Hybrid Miner
    "hyperon>=0.2.0",
    "hybrid-miner @ git+https://github.com/iCog-Labs-Dev/hybrid-miner.git@v0.1.0",

    # MORK Service and Retrieval
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "hnswlib>=0.8.0",

    # Tier 3 Queue
    "redis>=5.0.0",

    # Shared Utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "wandb>=0.17.0",
]

[project.optional-dependencies]
# CUDA-enabled JAX; install according to the host CUDA environment.
gpu = [
    "jax[cuda12]>=0.4.30",
]
hyperon = [
    "hyperon>=0.2.0",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
gemini = ["google-genai>=2.0.0"]
ollama = ["ollama>=0.4"]
miner = [
    "hybrid-miner @ git+https://github.com/iCog-Labs-Dev/hybrid-miner.git@v0.1.1",
]
dev = [
    "jsonschema>=4.18",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.1",
    "black>=24.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "types-pyyaml",
    "types-redis",
]

[project.scripts]
semantic-parser = "parser.semantic.cli:main"
semantic-document-export = "parser.semantic.catalog_document_cli:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["data*", "tests*", "docs*", "build*", "*.egg-info"]
include = [
    "fabricpc_ext*",
    "nac*",
    "tier2_mork*",
    "parser*",
    "embedder*",
    "frozenllm*",
    "tier3*",
    "tiers*",
    "symbolic_pipeline*",
    "substrate*",
    "configs.parser_config",
    "residual*",
    "losses*",
    "stages*",
    "metrics*",
]

[tool.setuptools.package-data]
"parser.ontology" = ["*.yaml", "bundles/*.yaml"]
"configs.parser_config" = ["*.yaml", "*.jsonl"]

# ── Black ──────────────────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

# ── Ruff ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]

ignore = [
    "E501",
    "B008",
    "N806",
    "N803",
]

[tool.ruff.lint.isort]
known-first-party = [
    "fabricpc_ext",
    "nac",
    "tier2_mork",
    "parser",
    "frozenllm",
    "substrate",
    "embedder",
    "tier3",
    "tiers",
    "symbolic_pipeline",
    "residual",
    "losses",
    "stages",
    "metrics",
]

[tool.ruff.lint.per-file-ignores]
"stages/stage_A/A3_model.py" = ["N999"]

# ── Mypy ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jax", "jax.*", "flax", "flax.*", "numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "parser.semantic.semantic_parser"
disable_error_code = ["no-any-return"]

# ── Pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "frozenllm"]
asyncio_mode = "auto"

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:jax",
]
