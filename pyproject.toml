[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-symbolic-llm"
version = "0.1.0"
description = "PC residual with symbolic head on frozen LLM"
requires-python = ">=3.10"
dependencies = [
    # FabricPC: pinned release — only upgrade deliberately
    "fabricpc @ git+https://github.com/trueagi-io/FabricPC.git@v0.3.0",

    # JAX ecosystem
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "optax>=0.2.0",
    "orbax-checkpoint>=0.5.0",

    # Frozen base model (PyTorch, hidden state extraction only)
    "torch==2.6.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "torchax==0.0.14.dev20260617",

    # MORK service
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "hnswlib>=0.8.0",

    # Tier 3 queue
    "redis>=5.0.0",

    # Symbolic pipeline
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "wandb>=0.17.0",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12]>=0.4.30",
]
hyperon = [
    "hyperon>=0.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.1",
    "black>=24.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "types-pyyaml",
    "types-redis",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "fabricpc_ext*",
    "nac*",
    "tier2_mork*",
    "parser*",
    "embedder*",
    "tier3*",
    "tiers*",
    "symbolic_pipeline*",
    "substrate*",
]

# ── Black ──────────────────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
# Black reformats code automatically. It never asks questions.
# Run manually: black .
# Runs automatically on every commit via pre-commit.

# ── Ruff ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (e.g. wrong indentation)
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "N",   # pep8 naming conventions
    "UP",  # pyupgrade (use modern Python syntax)
    "B",   # flake8-bugbear (catches likely bugs)
    "C4",  # flake8-comprehensions (cleaner list/dict/set comprehensions)
    "SIM", # flake8-simplify (simplifiable code patterns)
]
ignore = [
    "E501",  # line too long — black handles this
    "B008",  # do not perform function calls in default arguments (FastAPI uses this),
    "N806", "N803"
]

[tool.ruff.lint.isort]
# tells ruff which packages are "yours" so imports are sorted into the right group
known-first-party = [
    "fabricpc_ext",
    "nac",
    "tier2_mork",
    "parser",
    "embedder",
    "tier3",
    "tiers",
    "symbolic_pipeline",
]

# ── Mypy ───────────────────────────────────────────────────────────────────
[tool.mypy]
# Parse/check target. Must stay >= 3.12 because modern JAX/NumPy/Flax ship
# PEP 695 stubs ("type X = ...", generic "[T]" syntax) that older targets
# refuse to parse. The package itself remains 3.10-compatible at runtime
# (requires-python = ">=3.10"); this setting only controls type checking.
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true   # JAX and FabricPC stubs are incomplete

# Treat heavy numeric/JAX libraries as opaque: skip analyzing their internals
# (their names still resolve). Keeps local and CI runs fast and consistent.
[[tool.mypy.overrides]]
module = ["jax", "jax.*", "flax", "flax.*", "numpy", "numpy.*"]
follow_imports = "skip"
# Run manually: mypy .
# Runs automatically on every commit via pre-commit.

# ── Pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:jax",
]
# Run all tests: pytest
# Run only unit tests: pytest tests/unit/
# Run with output: pytest -v -s
