version: "narrative-v2"
relations:
  CreatesObligation:
    arity: 2
    arguments:
      - name: trigger_event
        type: Event
      - name: obligation
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "Extract when an event creates a binding duty, debt, or expected action."
  Owes:
    arity: 3
    arguments:
      - name: debtor
        type: Entity
      - name: creditor
        type: Entity
      - name: obligation
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "Extract when an agent has a specific unfulfilled duty toward another."
  Content:
    arity: 2
    arguments:
      - name: container_or_obligation
        type: Entity|Proposition
      - name: required_action
        type: Proposition|Event
    confidence_range: [0.0, 1.0]
    extraction_instruction: "Link an obligation, promise, or expected proposition to its content proposition or event. In an expectation-defeat frame, the first argument is the Proposition referenced by EvokesExpectation and Defeats."
  Discharges:
    arity: 2
    arguments:
      - name: fulfilling_event
        type: Event
      - name: obligation
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "Extract when an action successfully resolves a prior obligation or debt."
