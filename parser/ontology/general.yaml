version: "general-v1"
relations:
  Inheritance:
    arity: 2
    arguments:
      - name: instance
        type: Entity
      - name: class
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X is a type, kind, or subclass/instance relation of Y. Use only for taxonomic classification, not for temporary states or properties."
  MemberOf:
    arity: 2
    arguments:
      - name: member
        type: Entity
      - name: group
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X is a member of group, collection, organization, or set Y."
  PartOf:
    arity: 2
    arguments:
      - name: part
        type: Entity
      - name: whole
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X is a structural or conceptual part of Y."
  Has:
    arity: 2
    arguments:
      - name: owner
        type: Entity
      - name: possessed
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X has, owns, possesses, or contains Y in a possession-like relation. Do not use for ordinary transitive events such as hire, launch, approve, collect, or process."
  PropertyOf:
    arity: 2
    arguments:
      - name: entity
        type: Entity
      - name: property
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X has property or attribute Y. Use for descriptive attributes, not actions or events."
  StateOf:
    arity: 2
    arguments:
      - name: entity
        type: Entity
      - name: state
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X is in state Y. Use for states or conditions, not ordinary action events."
  CanDo:
    arity: 2
    arguments:
      - name: agent
        type: Entity
      - name: action
        type: Event
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X is capable of performing action Y. Use only for capability or ability, not for an action that actually occurred."
  UsedFor:
    arity: 2
    arguments:
      - name: entity
        type: Entity
      - name: purpose
        type: Entity|Event
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X is used for purpose or function Y. Use only when purpose or function is explicitly expressed. Do not use for ordinary events."
  Requires:
    arity: 2
    arguments:
      - name: entity_or_process
        type: Entity|Event
      - name: requirement
        type: Entity|Event
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X explicitly requires Y as a prerequisite, dependency, or necessary condition."
  Enables:
    arity: 2
    arguments:
      - name: enabler
        type: Entity|Event
      - name: enabled_action_or_state
        type: Event|Proposition
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X enables or makes possible Y. Use only for an enabling relation, not general causation."
  Produces:
    arity: 2
    arguments:
      - name: producer_or_process
        type: Entity|Event
      - name: result
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X produces, generates, yields, or outputs Y as a result. Use when the sentence explicitly expresses a production/result relation. Active and passive paraphrases must preserve the same Produces relation when this predicate is appropriate."
  Prevents:
    arity: 2
    arguments:
      - name: preventer
        type: Entity|Event
      - name: prevented_event_or_state
        type: Event|Proposition
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X prevents Y from occurring or continuing."
  LocatedIn:
    arity: 2
    arguments:
      - name: entity
        type: Entity
      - name: location
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X is located in Y."
  OccursIn:
    arity: 2
    arguments:
      - name: event_or_state
        type: Event
      - name: location
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "Event or state X occurs in or at location Y. Use when the location modifies an event. Do not use for the persistent location of an entity; use LocatedIn for that case."
  "On":
    arity: 2
    arguments:
      - name: entity
        type: Entity
      - name: surface
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X is physically on surface Y."
  Contains:
    arity: 2
    arguments:
      - name: container
        type: Entity
      - name: contained
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X contains Y spatially or structurally."
  Near:
    arity: 2
    arguments:
      - name: entity
        type: Entity
      - name: nearby_entity
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X is near Y."
  Between:
    arity: 3
    arguments:
      - name: entity
        type: Entity
      - name: reference_a
        type: Entity
      - name: reference_b
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X is spatially or conceptually between Y and Z."
  Before:
    arity: 2
    arguments:
      - name: earlier
        type: Event
      - name: later
        type: Event
    confidence_range: [0.0, 1.0]
    extraction_instruction: "X happens before Y."
  During:
    arity: 2
    arguments:
      - name: event_or_state
        type: Event
      - name: time_or_event
        type: Event|Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "Event or state X occurs during time or event Y. The first argument must be the event/state being temporally located. The second argument must be the containing time/event. Never reverse these roles."
  StartsAt:
    arity: 2
    arguments:
      - name: event
        type: Event
      - name: start_time
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "Event X starts at time Y."
  EndsAt:
    arity: 2
    arguments:
      - name: event
        type: Event
      - name: end_time
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "Event X ends at time Y."
  CreatedBy:
    arity: 2
    arguments:
      - name: creation
        type: Entity
      - name: creator
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "Persistent creator-origin relation: creation X was created, authored, constructed, or originated by creator Y. Use when the intended meaning is authorship/origin identity. Do not select CreatedBy merely because the sentence is passive or has the form \"X was <verb> by Y\". Do not use it to replace an ordinary event such as release, deploy, revise, publish, launch, process, or similar actions when the sentence is describing the event itself. When used, argument order must always be: creation first, creator second."
  WorksFor:
    arity: 2
    arguments:
      - name: person
        type: Entity
      - name: organization
        type: Entity
    confidence_range: [0.0, 1.0]
    extraction_instruction: "Person X works for organization Y. Use only for an employment or affiliation relation, not merely because one entity hired another in a single event."
